name: Check profile README

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check updater markers
        run: |
          set -euo pipefail
          test "$(grep -Fc '<!-- BLOG-POST-LIST:START -->' README.md)" -eq 1
          test "$(grep -Fc '<!-- BLOG-POST-LIST:END -->' README.md)" -eq 1
          awk '
            /<!-- BLOG-POST-LIST:START -->/ { start=NR }
            /<!-- BLOG-POST-LIST:END -->/ { end=NR }
            END { exit !(start && end && start < end) }
          ' README.md
      - name: Check relative links
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for target in re.findall(r'\]\(([^)]+)\)', Path('README.md').read_text()):
              if '://' not in target and not Path(target.split('#', 1)[0]).exists():
                  raise SystemExit(f'Broken link: {target}')
          PY
