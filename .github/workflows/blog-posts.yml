name: Update blog posts in README

on:
  schedule:
    - cron: "17 8 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest posts
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 'https://atakangul.com/posts.json' -o posts.json
          jq -r 'if type == "array" then .[0:3][] | select(.title and .url)
                 | "- [\(.title)](\(.url))" else empty end' \
             posts.json > posts.md
          if [ ! -s posts.md ]; then
            echo "No valid posts returned; keeping current list."
          fi

      - name: Insert posts between markers
        run: |
          [ -s posts.md ] || exit 0
          test "$(grep -Fc '<!-- BLOG-POST-LIST:START -->' README.md)" -eq 1
          test "$(grep -Fc '<!-- BLOG-POST-LIST:END -->' README.md)" -eq 1
          awk '
            /<!-- BLOG-POST-LIST:START -->/ { print; system("cat posts.md"); skip=1; next }
            /<!-- BLOG-POST-LIST:END -->/   { skip=0 }
            !skip
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh latest blog posts"
          git push
